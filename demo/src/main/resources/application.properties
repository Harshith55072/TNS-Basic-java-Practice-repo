spring.application.name=demo

# Loads DB_PASSWORD (and anything else) from the .env file sitting next to this
# module (demo/.env). "optional:" means Spring won't fail to start if it's missing.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection settings
# CHANGE url/username below to match your actual local PostgreSQL setup.
# Password comes from the DB_PASSWORD variable in demo/.env - never hardcoded here.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
